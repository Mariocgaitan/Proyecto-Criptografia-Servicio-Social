[project]
name = "sid-backend"
version = "0.1.0"
description = "Sistema de Inscripción Dinámica — Backend FastAPI"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    # Base de datos
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Criptografía y auth
    "pyotp>=2.9.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "google-auth>=2.27.0",
    "qrcode[pil]>=7.4.0",
    # Rate limiting
    "slowapi>=0.1.9",
    "sshtunnel>=0.4.0",
    "paramiko>=2.12,<3.0",
    "requests>=2.33.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
