<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SID — Sistema de Inscripción Dinámica{% endblock %}</title>
    <meta name="description" content="{% block description %}Sistema de pre-registro e inscripción con QR dinámico del Tec de Monterrey{% endblock %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tec: {
                            blue:  '#003087',
                            light: '#0057B8',
                            gold:  '#C8A951',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 font-sans antialiased">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/5 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-tec-blue to-tec-light rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <span class="text-white font-semibold text-lg tracking-tight">SID</span>
                    <span class="text-white/40 text-sm hidden sm:block">Sistema de Inscripción Dinámica</span>
                </div>
                <div class="text-white/50 text-sm">Tec de Monterrey</div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="pt-16 min-h-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-white/30 text-sm">
        <p>© 2026 Tec de Monterrey — Sistema de Inscripción Dinámica</p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
