name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /home/webservice/app

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis aiosqlite

      # conftest.py setea todas las env vars necesarias con valores válidos
      - run: pytest -q

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,REGISTRY,IMAGE_NAME
          command_timeout: 10m
          script: |
            set -euo pipefail
            # zsh trata "$VAR:l" como modificador; las llaves + tr evitan ambos problemas.
            cd "${APP_DIR}"

            echo "==> git pull (compose/nginx/scripts viven en el repo del VPS)"
            git fetch --quiet origin main
            git reset --hard origin/main

            IMAGE_NAME_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            IMAGE_LATEST="${REGISTRY}/${IMAGE_NAME_LC}:latest"

            echo "==> Pull de imagen: $IMAGE_LATEST"
            docker pull "$IMAGE_LATEST"

            echo "==> docker compose up -d"
            APP_IMAGE="$IMAGE_LATEST" \
              docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --remove-orphans

            echo "==> Esperando a que 'app' esté healthy"
            # 'status' es read-only en zsh, usamos otro nombre.
            app_health="starting"
            for i in $(seq 1 30); do
              app_health=$(docker inspect --format='{{.State.Health.Status}}' feria_app 2>/dev/null || echo "starting")
              if [ "$app_health" = "healthy" ]; then break; fi
              sleep 5
            done
            [ "$app_health" = "healthy" ] || { echo "app no arrancó healthy"; docker compose -f docker-compose.prod.yml logs --tail=100 app; exit 1; }

            echo "==> Migraciones Alembic"
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T app alembic -c /app/backend/alembic.ini upgrade head

            echo "==> Cleanup de imágenes viejas (>7 días sin usar)"
            docker image prune -f --filter "until=168h" || true

            echo "==> Estado final"
            docker compose -f docker-compose.prod.yml ps
