# Puerto 80: healthcheck interno + redirect a HTTPS.
# Cloudflare siempre nos habla por 443 en modo Full (Strict); el 80 queda para
# el container healthcheck y para forzar HTTPS si alguien pega la IP directo.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name feriaserviciosocial.com www.feriaserviciosocial.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Puerto 443: HTTPS con Cloudflare Origin CA (Full Strict).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name feriaserviciosocial.com www.feriaserviciosocial.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maintenance kill-switch. Toggle con scripts/deploy/maintenance-{on,off}.sh:
    # activado  → toca /etc/nginx/state/maintenance.on → toda URL devuelve 503.
    # Healthz sigue OK para no tirar el container healthcheck de Docker.
    set $maintenance 0;
    if (-f /etc/nginx/state/maintenance.on) {
        set $maintenance 1;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /etc/nginx/html;
        rewrite ^ /maintenance.html break;
        internal;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Endpoints sensibles: rate limit más agresivo
    location ~ ^/api/(v1/)?auth/ {
        if ($maintenance = 1) { return 503; }
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }

    location /api/ {
        if ($maintenance = 1) { return 503; }
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }

    location / {
        if ($maintenance = 1) { return 503; }
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }
}
