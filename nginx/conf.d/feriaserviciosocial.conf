server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name feriaserviciosocial.com www.feriaserviciosocial.com;

    # Healthcheck local del contenedor nginx
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Endpoints sensibles: rate limit más agresivo
    location ~ ^/api/(v1/)?auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }

    # Resto de /api/
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }

    # SPA + estáticos (servidos por FastAPI StaticFiles)
    location / {
        proxy_pass http://feria_backend;
        include /etc/nginx/conf.d/_proxy_params.inc;
    }
}
