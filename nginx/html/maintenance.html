<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feria de Servicio Social — Mantenimiento</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0f17;
        color: #e6edf3;
        padding: 2rem;
        text-align: center;
      }

      .card {
        max-width: 520px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 0.5rem;
        line-height: 1.5;
        color: #9ba7b4;
      }

      .dot {
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #f0b132;
        margin-right: 0.5rem;
        vertical-align: middle;
        animation: pulse 1.6s infinite ease-in-out;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <p><span class="dot"></span>Mantenimiento en curso</p>
      <h1>Volvemos en unos momentos</h1>
    </main>
  </body>
</html>
