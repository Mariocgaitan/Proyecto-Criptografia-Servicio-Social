services:
  db:
    image: postgres:16-alpine
    container_name: feria_postgres
    environment:
      POSTGRES_DB: feria_db
      POSTGRES_USER: feria_user
      POSTGRES_PASSWORD: feria_password_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feria_user -d feria_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: feria_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_local}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_local}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
